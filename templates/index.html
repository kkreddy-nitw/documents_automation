<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoDoc-UFS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
              mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'SFMono-Regular'],
            },
            boxShadow: {
              glow: '0 0 0 1px rgba(56, 189, 248, 0.25), 0 8px 24px rgba(15, 23, 42, 0.45)',
            },
          },
        },
      };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useMemo, useState, useEffect } = React;

      const ASPICE_OPTIONS = [
        'SWE.2 (Software Architectural Design)',
        'SWE.3 (Software Detailed Design & Unit Construction)',
        'SWE.4 Specifications (Software Unit Verification)',
        'SWE.5 Specifications (Software Integration Verification)',
      ];

      const FUSA_OPTIONS = [
        'HSI (Hardware-Software Interface)',
        'FMEA (Failure Mode and Effects Analysis)',
      ];

      const NAV_ITEMS = ['Dashboard', 'Runs', 'Artifacts', 'Standards', 'Settings'];

      function Sidebar() {
        return (
          <aside className="hidden lg:flex w-72 shrink-0 border-r border-slate-800 bg-slate-900/50 backdrop-blur flex-col p-6">
            <div>
              <p className="text-xs uppercase tracking-[0.22em] text-cyan-400">Samsung Semiconductor</p>
              <h1 className="mt-3 text-2xl font-semibold">AutoDoc-UFS</h1>
              <p className="mt-2 text-sm text-slate-400">UFS Automotive Firmware Compliance Automation</p>
            </div>
            <nav className="mt-8 space-y-2">
              {NAV_ITEMS.map((item, idx) => (
                <button key={item} className={`w-full text-left rounded-lg px-3 py-2 text-sm transition ${idx === 0 ? 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/40' : 'text-slate-300 hover:bg-slate-800/60 hover:text-slate-100 border border-transparent'}`}>
                  {item}
                </button>
              ))}
            </nav>
            <div className="mt-auto rounded-xl border border-slate-700 bg-slate-900 p-4">
              <p className="text-xs text-slate-400">Environment</p>
              <p className="font-mono text-xs text-cyan-300 mt-1">prod/internal/ufs</p>
            </div>
          </aside>
        );
      }

      function App() {
        const [sourcePath, setSourcePath] = useState('/repo/ufs_automotive_firmware');
        const [framework, setFramework] = useState('ASPICE');
        const [selected, setSelected] = useState([]);
        const [progress, setProgress] = useState(0);
        const [isGenerating, setIsGenerating] = useState(false);
        const [logs, setLogs] = useState([
          '[init] AutoDoc-UFS runtime booted.',
          '[ready] Awaiting source path + framework selection...',
        ]);

        const activeOptions = framework === 'ASPICE' ? ASPICE_OPTIONS : FUSA_OPTIONS;

        useEffect(() => setSelected([]), [framework]);

        const currentStep = useMemo(() => {
          if (progress < 20) return 'Initializing parser graph...';
          if (progress < 40) return 'Parsing AST...';
          if (progress < 60) return 'Mapping architecture...';
          if (progress < 80) return framework === 'ASPICE' ? 'Compiling SWE.3 compliance report...' : 'Correlating FuSa risk models...';
          if (progress < 100) return 'Rendering markdown artifacts...';
          return 'Generation completed.';
        }, [progress, framework]);

        const toggle = (option) => {
          setSelected((prev) => prev.includes(option) ? prev.filter((x) => x !== option) : [...prev, option]);
        };

        const generate = async () => {
          if (!sourcePath.trim() || selected.length === 0) return;
          setIsGenerating(true);
          setProgress(0);
          setLogs((prev) => [...prev, `[run] Starting generation for ${framework} -> ${selected.join(', ')}`]);
          await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sourcePath, framework, modules: selected }),
          });
          const stages = [16, 35, 52, 67, 84, 100];
          for (const pct of stages) {
            await new Promise((r) => setTimeout(r, 750));
            setProgress(pct);
            setLogs((prev) => [...prev, `[${String(pct).padStart(3, ' ')}%] ${pct === 100 ? 'Done.' : currentStep}`]);
          }
          setIsGenerating(false);
        };

        const markdown = `# AutoDoc-UFS Generated Report\n\n- **Repository:** \`${sourcePath}\`\n- **Framework:** **${framework}**\n- **Scope:** ${selected.join(', ') || 'N/A'}\n\n## Executive Summary\nThe source base was statically analyzed to generate audit-ready documentation for selected compliance targets.\n\n## Findings\n1. Interfaces mapped to architecture modules.\n2. Requirements linked to unit artifacts.\n3. Verification matrix compiled with trace IDs.\n\n## Action Items\n- Review risk exceptions.\n- Export signed PDF for ASPICE/FuSa review board.\n`;

        return (
          <div className="min-h-screen flex">
            <Sidebar />
            <main className="flex-1 p-6 lg:p-8 space-y-6">
              <section className="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 shadow-glow">
                <div className="flex items-start justify-between gap-4 flex-wrap">
                  <div>
                    <p className="text-xs uppercase tracking-[0.2em] text-cyan-400">Generation Pipeline</p>
                    <h2 className="text-2xl font-semibold mt-2">Compliance Document Configuration</h2>
                  </div>
                  <button onClick={generate} disabled={isGenerating || !sourcePath.trim() || selected.length === 0} className="rounded-lg bg-cyan-500 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400 active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-300">
                    {isGenerating ? 'Parsing & Generating...' : 'Generate Documentation'}
                  </button>
                </div>

                <div className="mt-6 grid lg:grid-cols-2 gap-5">
                  <div className="rounded-xl border border-slate-700 bg-slate-900 p-4">
                    <p className="text-sm font-medium text-slate-200">1) Source Selection</p>
                    <div className="mt-3 rounded-lg border border-dashed border-slate-600 bg-slate-800/60 p-4 hover:border-cyan-500 transition">
                      <label className="text-xs text-slate-400">UFS Firmware Source Code Repository/Path</label>
                      <input value={sourcePath} onChange={(e) => setSourcePath(e.target.value)} className="mt-2 w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 font-mono text-sm text-slate-100 outline-none focus:ring-2 ring-cyan-500/50" />
                    </div>
                  </div>

                  <div className="rounded-xl border border-slate-700 bg-slate-900 p-4">
                    <p className="text-sm font-medium text-slate-200">2) Framework Selection</p>
                    <div className="mt-3 inline-flex rounded-lg border border-slate-700 p-1 bg-slate-800">
                      {['ASPICE', 'FuSa'].map((f) => (
                        <button key={f} onClick={() => setFramework(f)} className={`px-4 py-2 text-sm rounded-md transition ${framework === f ? 'bg-cyan-500 text-slate-950' : 'text-slate-300 hover:text-slate-100'}`}>
                          {f === 'FuSa' ? 'FuSa (Functional Safety)' : 'ASPICE Framework'}
                        </button>
                      ))}
                    </div>
                    <p className="mt-3 text-xs text-slate-400">3) Dynamic Sub-Selection</p>
                    <div className="mt-2 grid gap-2">
                      {activeOptions.map((opt) => {
                        const on = selected.includes(opt);
                        return (
                          <button key={opt} onClick={() => toggle(opt)} className={`text-left rounded-lg border px-3 py-2 text-sm transition ${on ? 'border-cyan-500 bg-cyan-500/10 text-cyan-200' : 'border-slate-700 bg-slate-800/50 text-slate-300 hover:bg-slate-800'}`}>
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="mt-6">
                  <div className="flex justify-between text-xs text-slate-400 mb-2">
                    <span>{currentStep}</span><span>{progress}%</span>
                  </div>
                  <div className="h-2 rounded-full bg-slate-800 overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-indigo-500 to-cyan-500 transition-all duration-700" style={{ width: `${progress}%` }}></div>
                  </div>
                </div>
              </section>

              <section className="grid xl:grid-cols-2 gap-6">
                <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
                  <p className="text-sm font-semibold">Console Logs</p>
                  <div className="mt-4 rounded-xl border border-slate-700 bg-black/50 p-4 h-80 overflow-auto font-mono text-xs text-emerald-300 space-y-1">
                    {logs.map((log, idx) => <div key={`${idx}-${log}`}>{log}</div>)}
                  </div>
                </div>
                <div className="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
                  <p className="text-sm font-semibold">Generated Markdown Preview</p>
                  <pre className="mt-4 h-80 overflow-auto rounded-xl border border-slate-700 bg-slate-950 p-4 text-xs leading-6 text-slate-200 font-mono whitespace-pre-wrap">{markdown}</pre>
                </div>
              </section>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
